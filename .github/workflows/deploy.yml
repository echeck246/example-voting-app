name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Test vote service
        run: |
          cd vote
          python -m compileall .

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Test result service
        run: |
          cd result
          npm install --package-lock-only || true

  build-and-scan:
    name: Build, Scan with Trivy, and Push
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [vote, result, worker]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: actions/setup-buildx-action@v3

      - name: Lowercase Docker Username
        id: prep
        run: |
          USER_LOWER=$(echo "${{ secrets.DOCKER_USERNAME }}" | tr '[:upper:]' '[:lower:]')
          echo "docker_user=$USER_LOWER" >> $GITHUB_OUTPUT

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ steps.prep.outputs.docker_user }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Image to Local Daemon
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          load: true
          tags: ${{ steps.prep.outputs.docker_user }}/voting-app-${{ matrix.service }}:${{ github.sha }}

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: ${{ steps.prep.outputs.docker_user }}/voting-app-${{ matrix.service }}:${{ github.sha }}
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

      - name: Push Image to Docker Hub
        if: github.event_name != 'pull_request'
        run: |
          docker push ${{ steps.prep.outputs.docker_user }}/voting-app-${{ matrix.service }}:${{ github.sha }}